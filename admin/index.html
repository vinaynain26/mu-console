<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pages · MU Console</title>
<link rel="stylesheet" href="/console-ui/app.css">
</head><body>
<div class="shell">
  <nav class="side"></nav>
  <main>
    <div class="phead">
      <div>
        <h1>Pages</h1>
        <div class="sub">Edit copy in the studio, or open a page and edit it in place.</div>
      </div>
    </div>
    <div id="ai"></div>
    <div class="toolbar">
      <label class="search">
        <span id="qicon"></span>
        <input type="search" id="q" placeholder="Search pages…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <span class="count" id="count"></span>
    </div>
    <div class="pgrid" id="list"><div class="empty">Loading pages…</div></div>
  </main>
</div>
<script type="module">
import { chrome, api, esc, ago, icon, $ } from '/console-ui/shell.js';

const acct = await chrome('pages');
$('qicon').outerHTML = icon('search');

if (!acct.ai) {
  $('ai').innerHTML = `<div class="banner warn">
    <b>AI writer is off.</b> Set <code>ANTHROPIC_API_KEY</code> in the environment and restart
    to enable rewriting, variants and section passes.</div>`;
}

/* a stable, subtle tint per page so the tile grid doesn't read as one gray
   slab — brand accents only, always from the MU trio */
const TINTS = ['rgba(57,182,216,.09)', 'rgba(247,211,68,.07)', 'rgba(227,131,48,.09)'];
const tint = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 997; return TINTS[h % 3]; };
/* tiles are typeset like MU covers: grotesque first word, serif italic rest */
const cover = (t) => {
  const words = t.trim().replace(/[_-]+/g, ' ').split(/\s+/);
  return words.length > 1
    ? esc(words[0]) + ' <em>' + esc(words.slice(1).join(' ')) + '</em>'
    : esc(words[0]);
};

try {
  const pages = await api('/api/pages');
  /* The tile is a stretched link to Edit (no nested anchors — the browser
     deletes those); View lives above it as its own small anchor. */
  const card = p => `
    <div class="pcard" data-name="${esc(p.title.toLowerCase())}">
      <div class="pthumb" style="--tint:${tint(p.title)}">
        ${p.source === 'instrumented' ? '<span class="pchip" title="Rendered by its own app">App</span>' : ''}
        <div class="pcover">
          <div class="pcover__t${p.title.length > 18 ? ' small' : ''}">${cover(p.title)}</div>
          <span class="pcover__u" aria-hidden="true"></span>
        </div>
        <a class="pview" href="/page/${esc(p.slug)}" target="_blank" rel="noopener"
           title="View live page" aria-label="View ${esc(p.title)} live">${icon('open', 14)}</a>
      </div>
      <a class="plink" href="/console/page/${esc(p.slug)}" aria-label="Edit ${esc(p.title)}"></a>
      <div class="pbody">
        <div class="pmeta">
          ${p.unpublished > 0
            ? `<span class="dot warn"></span><span class="warn">${p.unpublished} draft${p.unpublished === 1 ? '' : 's'}</span>`
            : `<span class="dot ok"></span><span class="ok">Live</span>`}
          <span>·</span><span>${p.fields} fields</span>
          <span>·</span><span title="last published">${p.last_publisher ? esc(p.last_publisher) + ' ' + ago(p.last_published) : 'never published'}</span>
        </div>
      </div>
    </div>`;
  $('list').innerHTML = pages.length ? pages.map(card).join('') : '<div class="empty">No pages yet.</div>';

  const q = $('q');
  const count = (n) => { $('count').textContent = n === pages.length ? `${n} page${n === 1 ? '' : 's'}` : `${n} of ${pages.length}`; };
  count(pages.length);

  q.addEventListener('input', () => {
    const needle = q.value.trim().toLowerCase();
    let shown = 0;
    for (const el of document.querySelectorAll('.pcard')) {
      const hit = !needle || el.dataset.name.includes(needle);
      el.style.display = hit ? '' : 'none';
      if (hit) shown++;
    }
    count(shown);
    let none = document.getElementById('noneMatch');
    if (!shown && !none) {
      none = Object.assign(document.createElement('div'), { id: 'noneMatch', className: 'empty' });
      none.textContent = 'No pages match.';
      $('list').appendChild(none);
    } else if (shown && none) none.remove();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
  q.focus();
} catch (e) {
  $('list').innerHTML = '<div class="empty">Could not load pages: ' + esc(e.message) + '</div>';
}
</script></body></html>
