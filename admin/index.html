<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pages · MU Console</title>
<link rel="stylesheet" href="/console-ui/app.css">
</head><body>
<div class="shell">
  <nav class="side"></nav>
  <main>
    <div class="phead">
      <div>
        <h1>Pages</h1>
        <div class="sub">Edit copy in the studio, or open a page and edit it in place.</div>
      </div>
    </div>
    <div id="ai"></div>
    <input type="search" id="q" class="psearch" placeholder="Search pages…" autocomplete="off">
    <div class="pgrid" id="list"><div class="empty">Loading pages…</div></div>
  </main>
</div>
<script type="module">
import { chrome, api, esc, ago, $ } from '/console-ui/shell.js';

const acct = await chrome('pages');

if (!acct.ai) {
  $('ai').innerHTML = `<div class="banner warn">
    <b>AI writer is off.</b> Set <code>ANTHROPIC_API_KEY</code> in the environment and restart
    to enable rewriting, variants and section passes.</div>`;
}

try {
  const pages = await api('/api/pages');
  /* This row used to be one big <a> with another <a> nested inside it for the
     live link. Nested anchors are invalid HTML, so the browser silently dropped
     the inner one and the row rendered with no visible button at all —
     clickable, but with nothing to tell you so. Explicit buttons instead. */
  const card = p => `
    <div class="pcard" data-name="${esc(p.title.toLowerCase())}">
      <div class="pcard__top">
        <h3>${esc(p.title)}</h3>
        <div class="pcard__badges">
          ${p.source === 'instrumented' ? '<span class="badge" title="Rendered by its own app">app</span>' : ''}
          ${p.unpublished > 0
            ? `<span class="badge warn"><span class="dot"></span>${p.unpublished}</span>`
            : `<span class="badge ok">Published</span>`}
        </div>
      </div>
      <div class="meta">${p.fields} fields &middot; ${p.sections} sections<br>
        last published ${p.last_publisher ? esc(p.last_publisher) + ' ' + ago(p.last_published) : 'never'}</div>
      <div class="pcard__acts">
        <a class="btn primary" href="/console/page/${esc(p.slug)}">Edit</a>
        <a class="btn" href="/page/${esc(p.slug)}" target="_blank" rel="noopener">View &#8599;</a>
      </div>
    </div>`;
  $('list').innerHTML = pages.length ? pages.map(card).join('') : '<div class="empty">No pages yet.</div>';

  const q = $('q');
  q.addEventListener('input', () => {
    const needle = q.value.trim().toLowerCase();
    let shown = 0;
    for (const el of document.querySelectorAll('.pcard')) {
      const hit = !needle || el.dataset.name.includes(needle);
      el.style.display = hit ? '' : 'none';
      if (hit) shown++;
    }
    let none = document.getElementById('noneMatch');
    if (!shown && !none) {
      none = Object.assign(document.createElement('div'), { id: 'noneMatch', className: 'empty' });
      none.textContent = 'No pages match.';
      $('list').appendChild(none);
    } else if (shown && none) none.remove();
  });
  q.focus();
} catch (e) {
  $('list').innerHTML = '<div class="empty">Could not load pages: ' + esc(e.message) + '</div>';
}
</script></body></html>
