<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · MU Console</title>
<link rel="stylesheet" href="/console-ui/app.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;background:var(--bg)}
  .box{width:100%;max-width:360px;padding:20px}
  .mark{text-align:center;margin-bottom:24px}
  .mark .logo{
    width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-size:18px;font-weight:700;margin:0 auto 14px;
  }
  .mark h1{font-size:19px;margin:0 0 4px;font-weight:650;letter-spacing:-.02em}
  .mark p{margin:0;color:var(--ink-sub);font-size:13px}
  .card{border-radius:var(--r-xl)}
  .card .inner{padding:22px}
  .field{margin-bottom:14px}
  .err{background:var(--crit-bg);color:var(--crit-ink);padding:10px 13px;border-radius:var(--r);
       font-size:13px;margin-bottom:14px;display:none}
  .err.show{display:block}
  .btn{height:36px}
  .demo{margin-top:16px;font-size:12.5px;color:var(--ink-sub);text-align:center;line-height:1.7}
  .demo code{background:rgba(255,255,255,.1);padding:2px 7px;border-radius:6px;font-size:12px}
</style></head><body>
<div class="box">
  <div class="mark">
    <div class="logo">M</div>
    <h1>MU Console</h1>
    <p>Masters' Union programme pages</p>
  </div>
  <div class="card"><div class="inner">
    <div class="err" id="err"></div>
    <form id="f">
      <div class="field">
        <label class="lbl" for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label class="lbl" for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" id="go" style="width:100%;justify-content:center">Sign in</button>
    </form>
  </div></div>
  <div class="demo" id="demo"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);

fetch('/api/account').then(r => r.json()).then(a => {
  $('demo').innerHTML =
    'Default login <code>' + (a.defaultEmail || 'figma.uiux@mastersunion.org') + '</code>' +
    '<br>One account exists per role — editor@, reviewer@, viewer@ · same password.';
});

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('go').disabled = true; $('err').classList.remove('show');
  try {
    const res = await fetch('/api/account/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value, password: $('password').value })
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || 'Could not sign in.');
    location.href = params.get('next') || '/console';
  } catch (e2) {
    $('err').textContent = e2.message; $('err').classList.add('show');
    $('go').disabled = false;
  }
});
</script></body></html>
