# Lovable → Handlebars → this CMS.
#
# Every route the Lovable app declares becomes its own page here. Add a page in
# Lovable and it arrives at /page/<slug>, fully editable — no workflow change,
# no route to register.
#
# The pipeline lives HERE rather than in the Lovable repo, which means the only
# credential needed is a READ token for the Lovable repo. Pushing the result is
# done with GitHub's built-in GITHUB_TOKEN, because this workflow commits to its
# own repository — no write-scoped personal token anywhere.
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Add ONE repository secret here (Settings → Secrets and variables → Actions):
#
#   LOVABLE_REPO_TOKEN
#     A fine-grained personal access token, scoped to vinaynain26/dark-welcome-page,
#     with Repository permissions → Contents: Read-only.
#     Read-only is deliberate: this workflow never writes to the Lovable repo.
#
# Then run it from the Actions tab, or leave the schedule to pick up changes.
# ──────────────────────────────────────────────────────────────────────────────
name: Sync page from Lovable

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Lovable repo to convert"
        required: false
        default: vinaynain26/dark-welcome-page
      home_slug:
        description: "Slug for the Lovable home route (/)"
        required: false
        default: dark-welcome-page
      force:
        description: "Re-ingest even if the Lovable repo has not moved"
        type: boolean
        required: false
        default: false
  schedule:
    # every 30 minutes; the run exits in seconds when nothing has changed
    - cron: "*/30 * * * *"

permissions:
  contents: write        # to commit the converted page back to this repo

concurrency:
  group: lovable-sync
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ github.event.inputs.source_repo || 'vinaynain26/dark-welcome-page' }}
  HOME_SLUG:   ${{ github.event.inputs.home_slug   || 'dark-welcome-page' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the CMS
        uses: actions/checkout@v4

      - name: Check the token is present
        run: |
          if [ -z "${{ secrets.LOVABLE_REPO_TOKEN }}" ]; then
            echo "::error::LOVABLE_REPO_TOKEN is not set. Add it under Settings → Secrets and variables → Actions (fine-grained PAT, Contents: Read-only on $SOURCE_REPO)."
            exit 1
          fi

      - name: Check out the Lovable app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.LOVABLE_REPO_TOKEN }}
          path: lovable

      # Converting means a full Vite build and a headless browser. Skip all of
      # it when the Lovable repo has not moved since the last ingest.
      - name: Has anything changed?
        id: changed
        run: |
          sha="$(git -C lovable rev-parse HEAD)"
          stamp=".lovable-sync/$HOME_SLUG.sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; echo "forced"; exit 0
          fi
          if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$sha" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "Lovable repo is unchanged at $sha — nothing to do."
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "Lovable repo is at $sha; last ingest was $( [ -f "$stamp" ] && cat "$stamp" || echo 'never' )"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'yes'
        with:
          node-version: 20

      - name: Install Chromium dependencies
        if: steps.changed.outputs.run == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libpango-1.0-0 libcairo2 libasound2t64

      - name: Build and convert
        if: steps.changed.outputs.run == 'yes'
        working-directory: lovable
        run: |
          npm ci || npm install
          npm install puppeteer serve --save-dev
          node convert.cjs "$HOME_SLUG"

      - name: Ingest every page the converter produced
        if: steps.changed.outputs.run == 'yes'
        run: |
          manifest="lovable/hbs-output/pages.json"
          test -s "$manifest" || { echo "::error::$manifest missing — the converter produced nothing"; exit 1; }
          npm ci --omit=dev || npm install --omit=dev
          node -e '
            const { execFileSync } = require("child_process");
            const fs = require("fs");
            const { pages } = JSON.parse(fs.readFileSync("lovable/hbs-output/pages.json", "utf8"));
            if (!pages || !pages.length) { console.error("::error::no pages in the manifest"); process.exit(1); }
            for (const p of pages) {
              const view = `lovable/hbs-output/views/${p.slug}.hbs`;
              // a route that rendered almost nothing means the scrape ran too
              // early; publishing that over a good page is worse than failing
              if (!fs.existsSync(view) || fs.statSync(view).size < 200) {
                console.error(`::error::${view} is missing or too small (${p.slug})`);
                process.exit(1);
              }
              console.log(`\n── ${p.slug} (${p.route}) ──`);
              execFileSync("node", ["scripts/ingest-page.mjs",
                "--view", view,
                "--layout", `lovable/hbs-output/views/layouts/${p.slug}.hbs`,
                "--slug", p.slug, "--title", p.title], { stdio: "inherit" });
            }
            console.log(`\ningested ${pages.length} page(s)`);
          ' 

      - name: Commit
        if: steps.changed.outputs.run == 'yes'
        run: |
          mkdir -p .lovable-sync
          echo "${{ steps.changed.outputs.sha }}" > ".lovable-sync/$HOME_SLUG.sha"
          git config user.name  "Lovable Sync"
          git config user.email "automation@mastersunion.org"
          git add views/ views/layouts/ data/ .lovable-sync/
          if git diff --cached --quiet; then
            echo "Nothing changed — the rendered pages are byte-identical."
            exit 0
          fi
          names=$(node -e 'const {pages}=require("./lovable/hbs-output/pages.json");console.log(pages.map(p=>p.slug).join(", "))')
          git commit -q -m "Sync from Lovable: $names

          Source: $SOURCE_REPO @ ${{ steps.changed.outputs.sha }}
          Converted and ingested by .github/workflows/lovable-sync.yml"
          # no --force: a rejected push means main moved and deserves a look
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Lovable → CMS"
            if [ "${{ steps.changed.outputs.run }}" = "yes" ] && [ -f lovable/hbs-output/pages.json ]; then
              echo "From \`$SOURCE_REPO\`:"
              echo ""
              node -e 'const {pages}=require("./lovable/hbs-output/pages.json");
                for (const p of pages) console.log(`- \`${p.route}\` → [/page/${p.slug}] · edit at \`/console/page/${p.slug}\``);'
            else
              echo "No change in \`$SOURCE_REPO\` — skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
